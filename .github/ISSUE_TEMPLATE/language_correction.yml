name: Kurdish language correction
description: A spelling, term, translation, month name or normalization rule that should change.
title: "[language] "
labels: [kurdish-language, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Language reviews from native speakers are the most valuable contribution to KDT.
        ئەگەر پێت باشترە، دەتوانیت بە کوردی بنووسیت.
  - type: input
    id: current
    attributes:
      label: Current text in KDT
      placeholder: "کانوونی یەکەم"
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: Proposed text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dates (months, weekdays, AM/PM, formats)
        - UI messages (i18n)
        - Currency names or symbols
        - Normalization or validation rules
        - Alphabet or sort order
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Usage and sources
      description: Where is this form used (region, institutions, publications)? Links help a lot. Is the current form wrong, or just less common?
    validations:
      required: true
