name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
        run: npm test
      - name: Test with coverage thresholds
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        run: npm run test:coverage
      - run: npm run build
      - name: Smoke-test the packed tarball
        run: npm run smoke

  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}

  package:
    name: Package exports, docs and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint package exports (publint + are-the-types-wrong)
        run: npm run lint:package
      - name: Build API docs (warnings are errors)
        run: npx typedoc --treatWarningsAsErrors
        working-directory: packages/core
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
